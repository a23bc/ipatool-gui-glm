name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs on the same ref so pushes don't queue up.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Pre-build: download ipatool release binaries for each target triple and
  # place them under src-tauri/binaries/ with the names Tauri expects:
  #   ipatool-<target-triple>(.exe)
  # This keeps the repo itself free of the ipatool binary (per user request)
  # while still allowing the bundled app to ship with it as a sidecar.
  # ─────────────────────────────────────────────────────────────────────
  fetch-ipatool:
    name: Fetch ipatool sidecar (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Asset naming in majd/ipatool v2.6.0+ follows:
        #   ipatool-<version>-<os>-<arch>.tar.gz
        # where <os> ∈ {macos, linux, windows, ios} and <arch> ∈ {amd64, arm64}.
        # All archives are .tar.gz (Windows is NOT a zip despite conventional
        # wisdom — ipatool uses tar.gz across the board).
        include:
          - { target: aarch64-apple-darwin,    asset_pattern: "macos-arm64",   ext: "tar.gz" }
          - { target: x86_64-apple-darwin,      asset_pattern: "macos-amd64",   ext: "tar.gz" }
          - { target: x86_64-pc-windows-msvc,   asset_pattern: "windows-amd64", ext: "tar.gz" }
          - { target: x86_64-unknown-linux-gnu, asset_pattern: "linux-amd64",   ext: "tar.gz" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnostic — list release assets (raw)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Raw GitHub API response for majd/ipatool latest release:"
          curl -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'User-Agent: ipatool-gui-ci' \
            https://api.github.com/repos/majd/ipatool/releases/latest \
            | python3 -c "import sys, json; d=json.load(sys.stdin); print('tag:', d.get('tag_name')); print('assets:'); [print(f'  - {a[\"name\"]}  ({a[\"size\"]} bytes)  -> {a[\"browser_download_url\"]}') for a in d.get('assets',[])]"

      - name: Fetch & extract ipatool release asset
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_ipatool.py --target "${{ matrix.target }}" --pattern "${{ matrix.asset_pattern }}" --ext "${{ matrix.ext }}"

      - name: Diagnostic — ls src-tauri/binaries (always)
        if: always()
        run: |
          echo "Listing src-tauri/binaries/ after fetch:"
          ls -la src-tauri/binaries/ 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: ipatool-${{ matrix.target }}
          path: src-tauri/binaries/
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # Build the Tauri app on each platform. We download all four sidecar
  # artifacts then filter to the one matching the current runner.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.settings.target }})
    needs: fetch-ipatool
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - { host: macos-14,  target: aarch64-apple-darwin,    args: "--target aarch64-apple-darwin"          }
          - { host: macos-13,  target: x86_64-apple-darwin,      args: "--target x86_64-apple-darwin"          }
          - { host: windows-2022, target: x86_64-pc-windows-msvc, args: "--target x86_64-pc-windows-msvc"     }
          - { host: ubuntu-22.04, target: x86_64-unknown-linux-gnu, args: "--target x86_64-unknown-linux-gnu" }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install JS deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Download all sidecar artifacts
        uses: actions/download-artifact@v4
        with:
          path: sidecars

      - name: Place sidecar binary for current target
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          # Move the binary that matches THIS runner's target into src-tauri/binaries/.
          # Tauri expects the name pattern: ipatool-<target-triple>(.exe)
          if [ "${{ matrix.settings.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp sidecars/ipatool-${{ matrix.settings.target }}/ipatool-${{ matrix.settings.target }}.exe src-tauri/binaries/
          else
            cp sidecars/ipatool-${{ matrix.settings.target }}/ipatool-${{ matrix.settings.target }} src-tauri/binaries/
            chmod +x src-tauri/binaries/ipatool-${{ matrix.settings.target }}
          fi
          ls -la src-tauri/binaries/

      - name: Install Linux deps (Linux only)
        if: matrix.settings.host == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.settings.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-gui-${{ matrix.settings.target }}
          path: |
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/
            src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # On tag push, draft a release with all built artifacts attached.
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ipatool-gui-*
          merge-multiple: false

      - name: Flatten artifacts for upload
        shell: bash
        run: |
          mkdir -p flattened
          find release-assets -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.snap" \) -exec cp {} flattened/ \;
          ls -la flattened/

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: flattened/*
