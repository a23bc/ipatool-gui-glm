<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>ipatool-gui</title>
    <!-- Prevent white flash on boot: paint a dark background immediately. -->
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b0d11; color: #e6e9ef; }
      /* Simple loading spinner shown until the React tree mounts. */
      #boot { display:flex; align-items:center; justify-content:center; height:100%; }
      #boot .ring { width:28px; height:28px; border-radius:50%;
        border:3px solid #1f2430; border-top-color:#5b8def; animation:boot-rot 0.8s linear infinite; }
      @keyframes boot-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
